#
# Metrics: "up" from Prometheus scrapes. prometheus.yml lists many datanode hostnames;
# unused targets stay down — "offset 5m == 1" avoids alerting on never-up targets.

groups:
  - name: ozone_datanode
    rules:
      - alert: OzoneDatanodeDown
        expr: |
          up{job="ozone", component="datanode"} == 0
          and up{job="ozone", component="datanode"} offset 30m == 1
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: Datanode scrape target is down
          description: Prometheus cannot scrape datanode at {{ $labels.instance }}.

      - alert: OzoneDatanodeRestarted
        expr: changes(up{job="ozone", component="datanode"}[15m]) >= 2
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Datanode process restarted
          description: Datanode at {{ $labels.instance }} was unreachable and recovered (scrape up flapped).
