# Metrics: "up" is produced by Prometheus while scraping /prom (not exported by SCM).

groups:
  - name: ozone_scm
    rules:
      - alert: OzoneScmDown
        expr: |
          up{job="ozone", component="scm"} == 0
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: SCM scrape target is down
          description: Prometheus cannot scrape SCM at {{ $labels.instance }}.

      - alert: OzoneScmRestarted
        expr: changes(up{job="ozone", component="scm"}[15m]) >= 2
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Storage Container Manager process restarted
          description: SCM at {{ $labels.instance }} was unreachable and recovered (scrape up flapped).
