#
# Metrics: "up" is produced by Prometheus while scraping /prom (not exported by OM).
# Ozone /prom serves Hadoop metrics2 (e.g. jvm_metrics_*) via PrometheusMetricsSink;
# process_start_time_seconds is not published there.

groups:
  - name: ozone_om
    rules:
      - alert: OzoneOmDown
        expr: |
          up{job="ozone", component="om"} == 0
          and up{job="ozone", component="om"} offset 30m == 1
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: Ozone Manager scrape target is down
          description: Prometheus cannot scrape OM at {{ $labels.instance }}.

      - alert: OzoneOmRestarted
        expr: changes(up{job="ozone", component="om"}[15m]) >= 2
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Ozone Manager process restarted
          description: OM at {{ $labels.instance }} was unreachable and recovered (scrape up flapped).
